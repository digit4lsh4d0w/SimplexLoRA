[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project]
name = "peft"
version = "0.12.1.dev0"
description = "Parameter-Efficient Fine-Tuning (PEFT) with Simplex LoRA support"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "accelerate>=1.15.0",
    "huggingface-hub>=2.4.0",
    "numpy>=2.5.4",
    "packaging>=26.3",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.22.1",
]

[tool.ruff]
target-version = "py315"
line-length = 119

[tool.ruff.lint]
extend-select = [
    "C", # Complexity
    "E", # PEP8 errors
    "F", # PEP8 formatting
    "I", # Import sorting
    "UP", # Pyupgrade upgrades
    "W", # PEP8 warnings
    "PT009", # Pytest assertions
]
ignore = [
    "C901", # Function too complex
    "E501", # Line length (handled by ruff-format)
    "UP007", # X | Y style Unions
]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["peft"]

[tool.pytest.ini_options]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
    "NUMBER",
]
addopts = "--cov=src/peft --cov-report=term-missing --durations=10"
markers = [
    "single_gpu_tests: tests that run on a single GPU",
    "multi_gpu_tests: tests that run on multiple GPUs",
    "regression: whether to run regression suite test",
    "bitsandbytes: select bitsandbytes integration tests"
]

[dependency-groups]
dev = [
    "datasets>=5.1.0",
    "parameterized>=0.9.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.3",
    "scipy>=1.18.1",
]
